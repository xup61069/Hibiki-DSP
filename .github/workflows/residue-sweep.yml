name: residue-sweep

on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

concurrency:
  group: residue-sweep
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Sweep closed-issue lifecycle residue
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Limit 0 means fetch every paginated closed Issue; a positive limit
        # remains available for bounded dry-runs and fails closed on exhaustion.
        run: ./tools/clean-closed-issue-residue.ps1 -Limit 0 -State closed
