name: handoff-audit

on:
  issues:
    types: [opened, edited, reopened, closed, assigned, unassigned, labeled, unlabeled]
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

concurrency:
  group: handoff-audit
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

jobs:
  audit:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Audit all active handoffs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/handoff-check.ps1
