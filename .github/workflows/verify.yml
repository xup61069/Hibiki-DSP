name: verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

jobs:
  verify:
    runs-on: windows-2025
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Resolve branch-owned Issue
        if: github.event_name == 'pull_request'
        id: handoff
        shell: pwsh
        run: |
          $branch = $env:GITHUB_HEAD_REF
          if ([string]::IsNullOrWhiteSpace($branch)) {
            throw 'pull_request verification requires GITHUB_HEAD_REF.'
          }
          if ($branch -notmatch '^(?:codex|opencode)/(?<issue>[1-9][0-9]*)-[A-Za-z0-9][A-Za-z0-9._-]*$') {
            throw "Branch '$branch' must follow <agent>/<issue>-<slug> so CI can select its durable handoff."
          }
          "issue=$($Matches['issue'])" >> $env:GITHUB_OUTPUT

      - name: Branch-owned handoff gate
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/handoff-check.ps1 -Issue ${{ steps.handoff.outputs.issue }}

      - name: Commit message integrity gate
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./tools/run-commit-message-gate.ps1

      - name: Configure and test unsigned source
        shell: pwsh
        run: ./tools/verify.ps1

      - name: Documentation gate
        shell: pwsh
        run: ./tools/docs-check.ps1

      - name: Source-only and secret gate
        shell: pwsh
        run: ./tools/source-policy.ps1

      - name: Source-tag provenance gate
        if: github.ref_type == 'tag'
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE/tools/release-provenance-check.ps1" -Tag $env:GITHUB_REF_NAME'

      - name: Source-only CI publication gate
        shell: pwsh
        run: ./tools/source-only-ci-check.ps1

      - name: Evidence provenance gate
        shell: pwsh
        run: ./tools/evidence-audit.ps1

      - name: Gate self-test sweep
        shell: pwsh
        run: |
          $modes = @()
          foreach ($script in @(Get-ChildItem -LiteralPath tools -Filter '*.ps1' -File | Sort-Object Name)) {
            $command = Get-Command -Name $script.FullName -ErrorAction SilentlyContinue
            if ($null -eq $command -or -not $command.Parameters.ContainsKey('SelfTest')) { continue }
            $global:LASTEXITCODE = 0
            & $script.FullName -SelfTest
            if ($LASTEXITCODE -ne 0) { throw "Gate self-test failed for $($script.Name): exit $LASTEXITCODE" }
            $modes += $script.Name
          }
          $minimumModes = 26
          if ($modes.Count -lt $minimumModes) {
            throw "Expected at least $minimumModes gate self-test modes, found $($modes.Count): $($modes -join ', ')"
          }
          Write-Output "Gate self-test sweep passed ($($modes.Count) modes): $($modes -join ', ')"

      - name: Browser extension source gate
        shell: pwsh
        run: ./tools/extension-check.ps1

      - name: Installer source gate
        shell: pwsh
        run: ./tools/installer-check.ps1

      - name: Control model gate
        shell: pwsh
        run: ./tools/control-model-check.ps1

      - name: Control model JSON contract gate
        shell: pwsh
        run: dotnet run --project ./apps/control-model-json-contract-check/Hibiki.ControlModel.JsonContract.Check.csproj --configuration Release --nologo

      - name: WinUI source shell gate
        shell: pwsh
        run: ./tools/winui-shell-check.ps1

      - name: Driver INF source gate
        shell: pwsh
        run: ./tools/driver-source-check.ps1

      - name: JSON contract parse gate
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath . -Recurse -Filter *.json -File |
            Where-Object { $_.FullName -notmatch '\\(\.git|\.local|obj|bin)\\' })
          foreach ($file in $files) { Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json | Out-Null }
          Write-Output "JSON parse gate passed ($($files.Count) files)."

      - name: Stable identity gate
        shell: pwsh
        run: ./tools/distribution-check.ps1
