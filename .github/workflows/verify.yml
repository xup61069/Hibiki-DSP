name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Configure and test unsigned source
        shell: pwsh
        run: ./tools/verify.ps1

      - name: Documentation gate
        shell: pwsh
        run: ./tools/docs-check.ps1

      - name: Source-only and secret gate
        shell: pwsh
        run: ./tools/source-policy.ps1

      - name: Source-only CI publication gate
        shell: pwsh
        run: ./tools/source-only-ci-check.ps1

      - name: Gate self-test sweep
        shell: pwsh
        run: |
          $modes = @()
          foreach ($script in @(Get-ChildItem -LiteralPath tools -Filter '*.ps1' -File | Sort-Object Name)) {
            $command = Get-Command -Name $script.FullName -ErrorAction SilentlyContinue
            if ($null -eq $command -or -not $command.Parameters.ContainsKey('SelfTest')) { continue }
            $global:LASTEXITCODE = 0
            & $script.FullName -SelfTest
            if ($LASTEXITCODE -ne 0) { throw "Gate self-test failed for $($script.Name): exit $LASTEXITCODE" }
            $modes += $script.Name
          }
          $minimumModes = 5
          if ($modes.Count -lt $minimumModes) {
            throw "Expected at least $minimumModes gate self-test modes, found $($modes.Count): $($modes -join ', ')"
          }
          Write-Output "Gate self-test sweep passed ($($modes.Count) modes): $($modes -join ', ')"

      - name: Browser extension source gate
        shell: pwsh
        run: ./tools/extension-check.ps1

      - name: Installer source gate
        shell: pwsh
        run: ./tools/installer-check.ps1

      - name: Control model gate
        shell: pwsh
        run: ./tools/control-model-check.ps1

      - name: WinUI source shell gate
        shell: pwsh
        run: ./tools/winui-shell-check.ps1

      - name: Driver source boundary gate
        shell: pwsh
        run: ./tools/driver-source-check.ps1

      - name: Driver signability source gate
        shell: pwsh
        run: ./tools/driver-signability-check.ps1

      - name: JSON contract parse gate
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath . -Recurse -Filter *.json -File |
            Where-Object { $_.FullName -notmatch '\\(\.git|\.local|obj|bin)\\' })
          foreach ($file in $files) { Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json | Out-Null }
          Write-Output "JSON parse gate passed ($($files.Count) files)."

      - name: Stable identity gate
        shell: pwsh
        run: ./tools/distribution-check.ps1
