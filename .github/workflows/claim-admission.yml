name: claim-admission

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Unique UUID for this writer session.
        required: true
        type: string
      issue_number:
        description: Issue number to claim.
        required: true
        type: string
      branch:
        description: Proposed non-main branch name.
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: claim-admission-${{ github.repository }}
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Validate inputs and reserve claim atomically
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SESSION_ID: ${{ inputs.session_id }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BRANCH: ${{ inputs.branch }}
          OWNER_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SESSION_ID -notmatch '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') {
            throw 'session_id must be a valid UUID.'
          }
          $issueNumber = [int]::Parse($env:ISSUE_NUMBER)
          $branch = $env:BRANCH.Trim()
          if ($branch -eq '' -or $branch -eq 'main') { throw 'branch must be a unique working branch.' }

          # Parse the handoff block without executing the main audit path.
          # Dot-source (not invoke) so the helper functions survive this
          # block; an invocation scope would discard them on exit.
          . {
            param([string]$ScriptPath)
            $content = Get-Content -LiteralPath $ScriptPath -Raw
            $start = $content.IndexOf('function Get-HandoffScalar')
            if ($start -lt 0) { throw 'Admission helpers are missing from tools/handoff-check.ps1.' }
            $end = $content.IndexOf('if ($AdmissionPrecheck)', $start)
            if ($end -lt 0) { throw 'Admission overlap helpers are missing from tools/handoff-check.ps1.' }
            Invoke-Expression $content.Substring($start, $end - $start)
          } (Join-Path (Get-Location) 'tools/handoff-check.ps1')
          if (-not (Get-Command Test-AdmissionIssueEligibility -ErrorAction SilentlyContinue)) {
            throw 'Admission helpers did not load into session scope; fail closed.'
          }

          $issue = gh issue view $issueNumber --json number,state,title,body,labels,assignees | ConvertFrom-Json
          if (-not $issue -or [int]$issue.number -ne $issueNumber) { throw "Issue #$issueNumber not found." }
          Test-AdmissionIssueEligibility -IssueData $issue
          $owner = Get-AdmissionOwner -Body ([string]$issue.body) -IssueNumber $issueNumber

          pwsh -NoProfile -File tools/handoff-check.ps1 -AdmissionPrecheck -Issue $issueNumber

          $baseCommit = Get-AdmissionBaseCommit -Body ([string]$issue.body) -IssueNumber $issueNumber
          $apiArgs = @(
            'api',
            '--method', 'POST', '/repos/{owner}/{repo}/git/refs',
            '-F', ('ref=refs/heads/' + $branch),
            '-f', ('sha=' + $baseCommit),
            '--jq', '.ref'
          )
          & gh @apiArgs | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Branch reservation failed for '$branch'; fail closed." }

          try {
            Add-IssueLabelSafe -IssueNumber $issueNumber -Label 'claim-pending'
            pwsh -NoProfile -File tools/handoff-check.ps1
            $readback = ConvertTo-AdmissionReadback -GhArgs @(
              'issue', 'view', "$issueNumber", '--json', 'labels,assignees,state'
            )
            Test-PendingNoAssigneeReadback -Readback $readback -IssueNumber $issueNumber
            Set-IssueLabelsSafe -IssueNumber $issueNumber -Add @('claimed') -Remove @('claim-pending')
            gh issue edit $issueNumber --add-assignee $owner
            if ($LASTEXITCODE -ne 0) { throw "Assignee assignment failed for Issue #$issueNumber." }
            $claimedReadback = ConvertTo-AdmissionReadback -GhArgs @(
              'issue', 'view', "$issueNumber", '--json', 'labels,assignees,state'
            )
            Test-ClaimedAdmissionReadback -Readback $claimedReadback -IssueNumber $issueNumber -Owner $owner
            Write-Output ("Admitted Issue #" + $issueNumber + " session=" + $env:SESSION_ID +
              " owner=" + $owner + " branch=" + $branch)
          } catch {
            Remove-IssueAdmissionStateSafe -IssueNumber $issueNumber -Owner $owner -Branch $branch -OwnerRepo $env:OWNER_REPO
            throw
          }
