name: claim-admission

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Unique UUID for this writer session.
        required: true
        type: string
      issue_number:
        description: Issue number to claim.
        required: true
        type: string
      branch:
        description: Proposed non-main branch name.
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: claim-admission-${{ github.repository }}
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs and admit claim
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SESSION_ID: ${{ inputs.session_id }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BRANCH: ${{ inputs.branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SESSION_ID -notmatch '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') { throw 'session_id must be a valid UUID.' }
          $issueNum = [int]::Parse($env:ISSUE_NUMBER)
          $issue = gh issue view $issueNum --json number,state,title,body,labels,assignees | ConvertFrom-Json
          if (-not $issue) { throw 'Issue not found.' }
          if ($issue.state -ne 'OPEN') { throw 'Issue is not open.' }
          $labelNames = @($issue.labels | ForEach-Object { $_.name })
          if ($labelNames -contains 'claimed' -or $labelNames -contains 'in-review') { throw 'already claimed/in-review; cannot admit.' }
          if (@($issue.assignees).Count -gt 0) { throw 'already has an assignee; cannot admit.' }
          if ($issue.body -notmatch 'hibiki:handoff-v1') { throw 'missing handoff block.' }
          Write-Output ('Issue admitted: #' + $issueNum + ' session=' + $env:SESSION_ID)