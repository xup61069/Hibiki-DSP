name: AI task slice
description: Draft one independently verifiable work slice for orchestrator assignment.
title: "[AI Task] "
body:
  - type: markdown
    attributes:
      value: |
        This form creates an unassigned TBD pre-claim. One Issue maps to one AI writer,
        one dedicated clone/worktree, one branch, one handoff block embedded in this
        Issue body, and one draft PR. The orchestrator fills the Issue number, branch,
        base and owner before adding an assignee and the `claimed` label.
  - type: textarea
    id: objective
    attributes:
      label: Objective and acceptance
      description: Define one independently verifiable outcome.
    validations:
      required: true
  - type: textarea
    id: handoff
    attributes:
      label: Machine-readable TBD pre-claim
      description: Keep this block intact. Declare the proposed write scope; the orchestrator replaces every TBD/unassigned field when claiming the Issue.
      render: markdown
      value: |
        <!-- hibiki:handoff-v1
        schema_version: 2
        issue: TBD
        branch: codex/TBD-short-slug
        target_branch: main
        base_commit: TBD
        role: worker
        owner: unassigned
        updated_at: TBD
        environment_fingerprint: TBD
        scope_globs: ["TBD"]
        shared_paths: []
        depends_on: []
        specs: []
        adrs: []
        next_safe_action: "TBD: orchestrator assigns the Issue and creates the isolated worktree."
        resume_commands: ["git fetch origin --prune", "pwsh -NoProfile -File tools/handoff-check.ps1 -Issue TBD"]
        -->
    validations:
      required: true
  - type: checkboxes
    id: preclaim
    attributes:
      label: Pre-claim checks
      options:
        - label: I checked open Issues, draft PRs and existing handoff blocks for scope overlap.
          required: true
        - label: I understand this draft is not assigned until the orchestrator fills the handoff, assigns one owner and adds `claimed`.
          required: true
        - label: The assigned writer will use a dedicated clone/worktree, push the first reviewable commit and open one draft PR.
          required: true
