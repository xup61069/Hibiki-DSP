name: AI execution slice
description: Create one complete work slice only when its assigned writer will start immediately.
title: "[Execution] "
labels: ["execution-request"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for immediate delivery, not planning or parked work. After creation, the
        orchestrator must add one concrete `hibiki:handoff-v1` block and complete serialized claim
        admission before the writer edits. The Issue, branch, PR, and CI are delivery records, not
        the result.
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the user-visible fix or capability this writer will deliver now.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable pass conditions, including integration on the target branch.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Assigned writer
      description: Enter the GitHub login of the writer who will begin immediately after claim.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Write scope and dependencies
      description: List repo-relative scope_globs, shared paths, semantic ownership, and dependencies.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: List the always-run and scope-matched gates plus any exact-head hosted checks.
    validations:
      required: true
  - type: checkboxes
    id: start
    attributes:
      label: Immediate execution checks
      options:
        - label: The assigned writer is ready to start immediately after a complete handoff and claim.
          required: true
        - label: Active Issues, PRs, scopes, semantic ownership, and worktree occupancy were checked for conflicts.
          required: true
        - label: The writer will use a non-main branch and will continue its draft PR through acceptance, fresh exact-head green checks, ready state, and merge unless a concrete blocker is recorded.
          required: true
